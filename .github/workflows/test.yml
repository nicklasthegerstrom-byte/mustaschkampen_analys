name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Run Python tests
        run: python -m pytest tests/test_scoring.py tests/test_image_handling.py tests/test_api.py -v

      - name: Run frontend tests
        run: node tests/test_frontend_android.js
